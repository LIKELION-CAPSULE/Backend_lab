# =====================================================================
# 캡슐 구역표 (zones.conf)
# 하네스 전체의 단일 원천. 훅, verify.sh, pr-write 검사가 모두 이 파일만 읽음.
# 이 파일을 바꾸는 것 = 하네스를 바꾸는 것 → harness/* 브랜치에서 PR로.
# 확인: python3 .harness/zones.py explain <파일경로>
# =====================================================================

[project]
base_package = com.capsule

[team]
# 키          GitHub 아이디            git 이메일 (git config user.email)
seunghee      olx-hee                  kerrykim03@gmail.com
seonguk       sunguk0410               kkcc4104@naver.com

[modules]
# 확정 (DB 최종본 섹션 기준, skeleton-plan.md 1장). 바뀌면 harness PR로 수정.
# 모듈          담당       테이블 / API(순서)
user           seonguk    # users, user_social_accounts, terms*, user_terms, user_memories / 1-8, 10, 13, 14, 24-27
content        seonguk    # live2d_*, avatars, study_rooms, room_backgrounds, characters, character_contents / 9
session        seonguk    # study_sessions, session_characters, session_events / 11, 12(룸 상세: 여러 모듈을 모으는 화면), 16-18, 21-23
relation       seunghee   # user_character_relations, relation_logs, user_unlocked_* (호감도·레벨·해금)
dialogue       seunghee   # conversations, conversation_recaps, character_*, chat_messages, llm_usages, prompt_versions, llm_lab_* · llm_eval_* (LLM) / 19, 20, 28

[zones]
# 위에서부터 먼저 맞는 줄 하나만 적용됨. 구체적인 패턴을 위에 둘 것.
# {base} 는 base_package 경로(com/capsule), {module} 은 [modules]의 각 모듈로 펼쳐짐.
# src/*/* = src/main/java, src/test/java, src/main/kotlin 등
# 구역 종류: local / harness / migration / contract / module / shared
#
# 패턴                                      구역
**/.env.example                             shared
**/.env*                                    local
**/*.local.*                                local
.claude/settings.local.json                 local
CLAUDE.md                                   harness
.claude/**                                  harness
.harness/**                                 harness
scripts/**                                  harness
.github/**                                  harness
docs/HARNESS.md                             harness
src/main/resources/db/migration/**          migration
src/*/*/{base}/common/**                    shared
src/*/*/{base}/{module}/api/**              contract
src/*/*/{base}/{module}/**                  module
**                                          shared
