# PR마다(그리고 develop에 머지될 때마다) 같은 검증 명령을 돌린다.
# pull_request 이벤트의 checkout은 "PR을 대상 브랜치에 합친 결과"라서,
# 각자 브랜치에선 통과하지만 합치면 깨지는 의미 충돌도 여기서 잡힌다.
name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 파일이 없으면(뼈대 생성 전) cache: gradle이 에러를 내므로 그때는 캐시를 끔
          cache: ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') != '' && 'gradle' || '' }}

      - name: 이미 머지된 마이그레이션을 고치지 않았는지
        if: github.event_name == 'pull_request'
        run: python3 .harness/zones.py frozen-migrations --base "origin/${{ github.base_ref }}"

      - name: zones.conf 엄격 검사 (TODO 남아 있으면 실패)
        run: python3 .harness/zones.py check --strict

      - name: scripts/verify.sh --full
        run: scripts/verify.sh --full
