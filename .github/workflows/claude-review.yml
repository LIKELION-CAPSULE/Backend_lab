# Claude 자동 리뷰. 비용 때문에 "위험한 PR"에만 자동으로 돈다.
#   자동: draft가 아닌 PR 중 계약/공용/마이그레이션 변경 또는 남의 모듈을 건드린 경우
#   수동: PR 댓글에 @claude (claude.yml)
# 리뷰어는 PR 본문(작성자의 작업 맥락) + diff + 레포(프로젝트 맥락) + 열린 상대 PR을 읽는다.
# 승인은 사람만 한다. Claude는 의견만 남긴다.
name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      labels: ${{ steps.g.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.base_ref }}
        run: |
          # 점 세 개: 이 PR의 변경만 (pr-zones.yml과 같은 이유, #16)
          labels="$(git diff --name-only "origin/$BASE...HEAD" | python3 .harness/zones.py classify --author "$AUTHOR")"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          if echo " $labels " | grep -Eq ' (zone:contract|zone:shared|zone:migration|cross-module) '; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        # 의견만 남기는 리뷰라 실패해도(토큰 만료·사용량 한도 등) PR을 빨갛게 만들지 않는다. 머지 조건은 verify·zones
        continue-on-error: true
        with:
          # 둘 중 하나만 설정 (docs/HARNESS.md '자동 리뷰 켜기' 참고)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            저장소 ${{ github.repository }} 의 PR #${{ github.event.pull_request.number }} 를 리뷰한다.
            작성자: ${{ github.event.pull_request.user.login }}
            이 PR의 구역 라벨: ${{ needs.gate.outputs.labels }}

            먼저 읽을 것:
            1. CLAUDE.md, docs/HARNESS.md 의 '구역 규칙', .harness/zones.conf (누가 어느 모듈 담당인지)
            2. PR 본문 (gh pr view). 작성자의 의도·결정·버린 대안이 여기 있다. diff를 이 의도에 비춰 판단할 것
            3. diff (gh pr diff)
            4. 열린 다른 PR 목록 (gh pr list --state open). 상대방이 지금 하고 있는 작업과 겹치거나 깨뜨리는지 확인

            라벨별로 특히 볼 것:
            - zone:contract: 기존 시그니처를 바로 바꾸거나 지웠는가? 확장→이전→제거 절차를 지켰는가? 이 계약을 쓰는 다른 모듈 코드가 깨지는가?
            - cross-module: 남의 모듈을 고친 이유가 PR 본문에 있는가? 담당자가 알아야 할 변경이 무엇인가?
            - zone:migration: 기존 마이그레이션 수정이 없는가? 남의 테이블을 바꾸는가? 컬럼 삭제·이름 변경을 한 번에 했는가?
            - zone:shared: 기능 변경과 섞여 있지 않은가? 공용 변경이 상대 브랜치에 미칠 영향은?
            공통: 모듈 경계(다른 모듈의 api 밖 패키지 참조), N+1, 트랜잭션 범위, 인증 누락, TODO(judgment) 자리를 몰래 구현했는지.

            출력은 한국어로, 요약 코멘트 하나(gh pr comment)와 꼭 필요한 줄에만 인라인 코멘트.
            요약 형식:
            ## Claude 리뷰
            **한 줄 판단**: (머지 가능 / 고친 뒤 머지 / 논의 필요)
            **반드시 고칠 것**: (없으면 '없음')
            **상대 작업에 미치는 영향**:
            **작성자에게 질문**:
            칭찬, 일반론, 스타일 지적은 쓰지 않는다. 승인(approve)은 하지 않는다.
          claude_args: >-
            --model sonnet
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(python3 .harness/zones.py:*)"
