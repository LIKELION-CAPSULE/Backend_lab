# PR 제목(커밋 규칙)과 본문 필수 섹션, 머지된 마이그레이션 불변, zones.conf를 검사한다. 몇 초면 끝난다.
# 머지 조건은 이 zones 초록. 빌드 · 테스트 CI(verify)는 ADR 0021에서 뺐다: 테스트는 각자 세션의 Stop 훅(verify.sh --quick)과 PR 전 scripts/verify.sh
# 사람 리뷰는 필수가 아니다.
# 빌드·모듈 구성을 바꿨는데 docs/decisions에 ADR이 없으면 needs-adr 경고 (원칙: 이유 먼저. 차단은 아님)
# PR 라벨은 붙이지 않는다 (ADR 0014). 구역 판정은 claude-review가 따로 해서 위험한 PR만 리뷰한다.
# 판정은 로컬 훅과 같은 .harness/zones.py 를 쓰므로 기준이 어긋나지 않는다.
name: pr-zones

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  zones:
    runs-on: ubuntu-latest
    env:
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 구역 판정 (로그용) · ADR 경고
        run: |
          # 점 세 개: 갈라진 지점부터의 변경만. 점 두 개면 실행 전에 develop이 앞서간 만큼 남의 변경까지 잡힘 (#16)
          changed="$(git diff --name-only "origin/$BASE...HEAD")"
          zones="$(printf '%s\n' "$changed" | python3 .harness/zones.py classify --author "$AUTHOR")"
          echo "구역: ${zones:-없음}"
          if [ -n "$(printf '%s\n' "$changed" | python3 .harness/zones.py adr-hint)" ]; then
            echo "::warning::빌드·모듈 구성(build.gradle·settings.gradle·zones.conf)을 바꿨는데 docs/decisions에 ADR이 없음"
          fi

      - name: 이미 머지된 마이그레이션을 고치지 않았는지
        run: python3 .harness/zones.py frozen-migrations --base "origin/$BASE"

      - name: zones.conf 엄격 검사 (TODO 남아 있으면 실패)
        run: python3 .harness/zones.py check --strict

      - name: PR 제목 (커밋 규칙)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | python3 .harness/zones.py check-pr-title

      - name: PR 본문 필수 섹션 (draft는 건너뜀)
        if: github.event.pull_request.draft == false
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # api.md를 바꿨으면 본문에 '### 코드 반영'(기능 PR·이슈·브랜치 또는 '없음')도 있어야 함 (ADR 0015)
          flag=""
          if git diff --name-only "origin/$BASE...HEAD" | grep -qx 'docs/specs/api.md'; then
            flag="--spec-changed"
            echo "api.md 변경 → 영향받는 API:"
            python3 .harness/zones.py spec-impact --base "origin/$BASE"
          fi
          printf '%s' "$BODY" | python3 .harness/zones.py check-pr-body $flag
