- id: borrow
  name: 빌려 달라
  text: 말포이가 뭔가를 퉁명스럽게 빌려 달라고 한다
  mode: null
  tMin: 10
  tMax: 65
  dt: 5
  cooldown: 10
  once: false
  minTurn: 2
- id: stuck_essay
  name: 에세이 막힘 들킴
  text: 말포이가 에세이 결론에서 막힌 게 들통난다
  mode: null
  tMin: 30
  tMax: 85
  dt: 10
  cooldown: null
  once: true
  minTurn: 3
- id: envy
  name: 훔쳐보다 들킴
  text: 말포이가 사용자 노트를 몰래 훔쳐보다 들킨다
  mode: null
  tMin: 30
  tMax: 90
  dt: 10
  cooldown: 12
  once: false
  minTurn: 4
- id: gossip
