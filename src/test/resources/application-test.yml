# 테스트용. DB·Redis는 Testcontainers(@ServiceConnection)가 채운다
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

capsule:
  llm:
    provider: fake # 테스트는 실제 LLM을 부르지 않는다 (환경변수가 있어도)
    fallback-provider: ""
    lab:
      enabled: true
  dialogue:
    memory-async: false # 기억 정리를 답장 요청 안에서 바로 돌려 테스트가 결과를 본다
  fake-integrations: true
  auth:
    jwt-secret: test-only-secret-0123456789abcdef0123
    refresh-cookie-secure: false
