# 공용 개발 DB(Supabase 개발 프로젝트)에 붙는 추가 프로필. local 위에 얹어 쓴다 (ADR 0017)
#   scripts/run-local.sh --shared  →  SPRING_PROFILES_ACTIVE=local,shared-db
# 둘과 프론트가 같은 데이터를 본다. 운영 Supabase 프로젝트와는 다른 프로젝트다
spring:
  datasource:
    # Supabase 개발 프로젝트 Connect > Type: JDBC, Method: Session pooler(5432, Transaction pooler 아님)
    # 대시보드 문자열의 ?user=...&password=... 는 빼고 jdbc:postgresql://<pooler 호스트>:5432/postgres?sslmode=require
    url: ${CAPSULE_DEV_DB_URL}
    username: ${CAPSULE_DEV_DB_USERNAME} # postgres.<개발 project-ref>
    password: ${CAPSULE_DEV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 2 # 둘 + 개발 서버가 pooler 연결 수 한도를 나눠 쓴다
  flyway:
    # 앱은 공용 DB에 마이그레이션하지 않는다. 머지 전 마이그레이션이 들어가면 상대 앱이 시작할 때 실패하기 때문
    # 마이그레이션 · 예시 시드는 develop에 머지될 때 GitHub Actions(dev-db-migrate)만 넣는다
    # 머지 전 마이그레이션 작업은 Docker 로컬 DB로. 테이블 · 컬럼이 없으면 ddl-auto: validate가 시작할 때 알려주지만
    # 제약(CHECK) · 인덱스 · 데이터 변경은 못 잡고 실행 중 오류로 난다
    enabled: false
