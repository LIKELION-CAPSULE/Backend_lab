<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡슐 운영실</title>
<style>
:root{--bg:#f4f5f7;--fg:#16181d;--mut:#667085;--card:#fff;--line:#e3e6ea;--soft:#f0f2f5;--acc:#4f5bd5;--accs:#eef0fc;--ok:#16835a;--oks:#e6f5ee;--warn:#a15c00;--warns:#fff4e0;--bad:#c93636;--bads:#fdecec;--me:#4f5bd5;--mefg:#fff;--bot:#fff;--code:#f6f7f9;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--fg:#e7e8ec;--mut:#9aa0ad;--card:#1b1d22;--line:#30333b;--soft:#23262d;--acc:#8b95ff;--accs:#262a45;--ok:#4cc38a;--oks:#173226;--warn:#e3b341;--warns:#33290f;--bad:#ff7070;--bads:#3a1c1c;--me:#5d68e0;--mefg:#fff;--bot:#23262d;--code:#16181c}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
pre,.mono{font-family:ui-monospace,"D2Coding",Consolas,"SF Mono",Menlo,monospace;font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;max-height:420px;overflow:auto}
h2,h3,h4{margin:0 0 6px;line-height:1.3}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;margin-top:14px}
a{color:var(--acc)}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:0;border-color:var(--acc)}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);margin:0}
input[type=number]{width:7em}
button{cursor:pointer;background:var(--soft);border-color:var(--line);white-space:nowrap}
button:hover:not(:disabled){filter:brightness(.97)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.danger{color:var(--bad)}
button.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button.ghost{background:none;border-color:transparent}
button.ghost:hover:not(:disabled){background:var(--soft)}
button.small{padding:3px 8px;font-size:12.5px}
summary{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-size:16px;margin-right:6px}
nav{display:flex;gap:2px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:11px 14px;font-weight:500;color:var(--mut)}
nav button.on{border-bottom-color:var(--acc);color:var(--fg);font-weight:700}
main{flex:1;min-height:0;overflow:auto}
.tab{max-width:1180px;margin:0 auto;padding:18px}
.tab.full{max-width:none;padding:0;height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--mut)}.small{font-size:12.5px}.strong{font-weight:600}.mono.small{font-size:11.5px}
.empty{color:var(--mut);padding:60px 20px;text-align:center}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f>.lbl{font-size:12.5px;font-weight:600}
.hint{font-size:12px;color:var(--mut)}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mut);white-space:nowrap;background:var(--card)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.off{opacity:.6}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bads)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warns)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--mut);vertical-align:middle}
.badge.on{background:var(--oks);color:var(--ok)}
.badge.draft,.badge.changed{background:var(--warns);color:var(--warn)}
.scope{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.scope.live{background:var(--bads);color:var(--bad)}
.scope.lab{background:var(--accs);color:var(--acc)}
.notice{border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13px;background:var(--warns);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.info{background:var(--accs);color:var(--fg);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.errtxt{color:var(--bad);font-size:12.5px;margin-top:4px}
.tokenbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:var(--warns);border-bottom:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(480px,92vw)}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.18);word-break:break-word}
.toast.ok{border-left-color:var(--ok)}.toast.info{border-left-color:var(--acc)}
.toast .x{float:right;padding:0 6px;margin-left:8px}
.toast pre{max-height:200px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);color:var(--fg);width:min(560px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,17,22,.45)}
.modal{padding:18px 20px}
.modal .body{margin:10px 0 16px;max-height:60vh;overflow:auto}
.modal ul{margin:6px 0;padding-left:20px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts.end{justify-content:flex-end}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
.tbl th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover,.tbl tr.on{background:var(--accs)}
.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card);padding:5px 12px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
/* 대화 테스트 */
.chat{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;height:100%;min-height:0}
.chat.nopanel{grid-template-columns:250px minmax(0,1fr)}
.chat.nopanel .panel,.chat.noroom .panel{display:none}
.chat.noroom{grid-template-columns:250px minmax(0,1fr)}
.rooms{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.rooms .top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.roomlist{overflow:auto;flex:1;padding:0 8px 12px}
.room{padding:8px 10px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.room:hover{background:var(--soft)}
.room.on{background:var(--accs)}
.room .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.convhead{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;max-width:min(680px,82%)}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start;align-items:flex-start}
.msg.sys{align-self:center;align-items:center;max-width:90%}
.bubble{padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me .bubble{background:var(--me);color:var(--mefg);border-bottom-right-radius:5px}
.bot .bubble{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px;cursor:pointer}
.bot .bubble:hover{border-color:var(--acc)}
.bot .bubble.err{background:var(--bads);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.sys .bubble{background:var(--soft);border:1px dashed var(--line);font-size:13px;cursor:pointer}
.msg .who{font-size:11.5px;color:var(--mut);margin:0 4px 3px}
.msg .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:4px 4px 0}
.expr{font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--accs);color:var(--acc)}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px 0;border-top:1px solid var(--line);background:var(--card)}
.quick button{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--card)}
.quick .lab{font-size:12px;color:var(--mut);margin-right:2px}
.menu{position:relative}
.menu>summary{list-style:none;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;bottom:34px;left:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;min-width:220px}
.menu .pop button{border:0;background:none;text-align:left;border-radius:7px;padding:7px 10px}
.menu .pop button:hover{background:var(--soft)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 14px;background:var(--card)}
.composer textarea{resize:none;max-height:160px}
.panel{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:14px 16px}
.panel .f{margin-bottom:14px}
.panel details.adv{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.panel details.adv>summary{font-weight:600;margin-bottom:10px}
.pinrow{display:grid;grid-template-columns:1fr 120px;gap:6px;align-items:center;margin-bottom:6px;font-size:12.5px}
/* 서랍 */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(680px,96vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);z-index:40;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:14px 18px 40px}
.sec{margin:0 0 16px}
.sec>h4{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv>div:nth-child(odd){color:var(--mut)}
.fold{border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--card)}
.fold>summary{padding:7px 10px;font-size:13px;font-weight:600}
.fold>pre{margin:0 8px 8px}
.sent{display:flex;flex-direction:column;gap:4px}
.sent>div{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--code);white-space:pre-wrap;word-break:break-word}
.sent>div b{font-size:11.5px;color:var(--mut);margin-right:4px}
.stars{display:inline-flex;gap:1px}
.star{border:0;background:none;padding:0 2px;font-size:20px;line-height:1;color:var(--line)}
.star.on{color:#f5b301}
/* 폼 줄 */
.rowsed{display:flex;flex-direction:column;gap:6px}
.rowline,.rowhead{display:grid;gap:6px;align-items:start}
.rowhead{font-size:11.5px;color:var(--mut);font-weight:600}
.rowline input:not([type=checkbox]),.rowline select,.rowline textarea{width:100%}
.rowline .x{padding:4px 8px;color:var(--mut)}
.rowsed>.add{align-self:flex-start;font-size:12.5px;color:var(--acc)}
.cell-check{display:flex;justify-content:center;padding-top:8px}
/* 설정 · 캐릭터 */
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.group{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.02em;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.set{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:4px 20px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .name{font-weight:600}
.set .path{font-size:11px;color:var(--mut);font-family:ui-monospace,Consolas,monospace}
.set .desc{font-size:12.5px;color:var(--mut);margin-top:2px}
.set .ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.set .ctl .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .def{font-size:12px;color:var(--mut)}
.set.dirty{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 7%,transparent),transparent 60%)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 16px;margin:0 -16px -16px;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.cfield{padding:14px 0;border-bottom:1px solid var(--line)}
.cfield:last-child{border-bottom:0}
.cfield .name{font-weight:600}
.cfield .desc{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.where{display:inline-block;font-size:11px;padding:0 7px;border-radius:6px;background:var(--soft);color:var(--mut);margin-left:6px;font-weight:600}
.sit{border:1px solid var(--line);border-radius:10px;margin:8px 0}
.sit>summary{padding:9px 12px;font-weight:600}
.sit>div{padding:0 12px 12px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.toc a{font-size:12.5px;text-decoration:none;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--fg)}
/* 프롬프트 */
.pgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.pkey{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.pkey:hover{background:var(--soft)}
.pkey.on{background:var(--accs);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
textarea.big{min-height:52vh;font-family:ui-monospace,"D2Coding",Consolas,monospace;font-size:12.5px}
.diff div{min-height:1.4em}
.diff .add{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.diff .del{background:color-mix(in srgb,var(--bad) 20%,transparent)}
/* 비용 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--acc)}
@media (max-width:1000px){.chat{grid-template-columns:200px minmax(0,1fr)}.panel{display:none}.chat.showpanel .panel{display:block;position:fixed;right:0;top:0;height:100%;width:min(360px,92vw);z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.15)}.set{grid-template-columns:minmax(0,1fr)}.pgrid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header id="hdr"><b class="logo">캡슐 운영실</b><span class="muted small">불러오는 중…</span></header>
<div id="tokenbar" class="tokenbar" hidden>
  <span>실험실 토큰이 필요해요.</span>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="X-Lab-Token">
  <button id="tokenSave" class="primary">저장하고 다시 불러오기</button>
</div>
<form id="loginbar" class="tokenbar" hidden>
  <span>관리자 로그인</span>
  <input id="loginUser" autocomplete="username" placeholder="아이디" required>
  <input id="loginPass" type="password" autocomplete="current-password" placeholder="비밀번호" required>
  <button class="primary">로그인</button>
  <span id="loginMsg" class="small"></span>
</form>
<nav id="tabs">
  <button data-tab="chat">💬 대화 테스트</button>
  <button data-tab="character">🎭 캐릭터</button>
  <button data-tab="settings">⚙️ 운영 설정</button>
  <button data-tab="prompts">📝 공통 프롬프트</button>
  <button data-tab="usage">💰 비용 · 상태</button>
</nav>
<main>
  <section class="tab full" id="tab-chat"></section>
  <section class="tab" id="tab-character" hidden></section>
  <section class="tab" id="tab-settings" hidden></section>
  <section class="tab" id="tab-prompts" hidden></section>
  <section class="tab" id="tab-usage" hidden></section>
</main>
<div id="drawer" class="drawer" hidden></div>
<dialog id="modal"></dialog>
<div id="toasts" class="toasts"></div>
<script>
'use strict';
// 캡슐 운영실 (내부 도구, 실험실). 빌드 · 외부 스크립트 없음. 서버: GET /internal/llm-lab, API: /internal/llm-lab/api/*
// 화면에 넣는 글자는 전부 h()가 텍스트 노드로 넣는다. innerHTML은 쓰지 않는다.
const BASE = '/internal/llm-lab/api';
const $ = s => document.querySelector(s);
const TABS = Object.create(null);
let META = null, SETTINGS = null, active = 'chat', TOKEN = '';
let ADMIN = ''; // 관리자로 로그인했으면 아이디 (TOKEN은 그 로그인 토큰, ADR 0027)
try { TOKEN = localStorage.getItem('llmLabToken') || ''; ADMIN = localStorage.getItem('llmLabAdmin') || ''; } catch { /* 저장소가 막힘: 메모리에만 둔다 */ }

/* ---------- DOM · 형식 도우미 ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  for (const [k, v] of Object.entries(attrs || {})) {  // 자식 다음에 속성: select.value가 옵션을 찾을 수 있게
    if (v == null) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el) el[k] = v;
    else if (v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  return el;
}
const sel = (items, value, attrs) => h('select', {...attrs, value: value ?? ''}, items.map(it => {
  const [v, t] = Array.isArray(it) ? it : [it, it];
  return h('option', {value: v}, t);
}));
const field = (label, el, hint) => h('label', {class: 'f'}, h('span', {class: 'lbl'}, label), el, hint && h('span', {class: 'hint'}, hint));
const muted = t => h('div', {class: 'muted small'}, t);
const scope = live => h('span', {class: 'scope ' + (live ? 'live' : 'lab'), title: live ? '저장하면 실제 서비스가 바로 이 값으로 움직여요' : '이 화면의 실험에만 쓰이고 서비스는 바뀌지 않아요'},
  live ? '● 서비스에 바로 반영' : '○ 실험에서만');
const table = (head, rows, numCols = []) => h('div', {class: 'scroll'}, h('table', {class: 'tbl'},
  h('thead', null, h('tr', null, head.map((x, i) => h('th', {class: numCols.includes(i) ? 'num' : ''}, x)))),
  h('tbody', null, rows.map(r => r instanceof Node ? r : h('tr', null, r.map((c, i) => h('td', {class: numCols.includes(i) ? 'num' : ''}, c ?? '—')))))));
const KRW_PER_USD = 1400;

// ISO-8601 시간(PT7S · PT0.3S · PT1M) ↔ 초. 서버(Jackson)는 Duration을 ISO 글자로 주고받는다
function isoToSec(v) {
  if (typeof v === 'number') return v;
  const m = /^PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(String(v ?? ''));
  if (!m || String(v) === 'PT') return null;
  return Math.round(((+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0)) * 1000) / 1000;
}
const secToIso = n => 'PT' + String(Math.round(Number(n) * 1000) / 1000) + 'S';
// 비교용 정규형: 키 정렬, ''·null 같게, null 칸 빼기, 시간은 초로 (PT1M = PT60S)
function canon(x) {
  const walk = v => {
    if (v === '' || v == null) return null;
    if (typeof v === 'string') { const s = /^PT[\d.HMS]+$/.test(v) ? isoToSec(v) : null; return s != null ? 'dur:' + s : v; }
    if (Array.isArray(v)) return v.map(walk);
    if (typeof v === 'object') { const o = {}; for (const k of Object.keys(v).sort()) { const w = walk(v[k]); if (w != null) o[k] = w; } return o; }
    return v;
  };
  return JSON.stringify(walk(x));
}
const same = (a, b) => canon(a) === canon(b);

function toast(msg, kind = 'err', detail = null) {
  const box = h('div', {class: 'toast ' + kind}, h('button', {class: 'x ghost', title: '닫기', onclick: () => box.remove()}, '×'),
    h('div', null, msg), detail && h('pre', null, detail));
  $('#toasts').append(box);
  setTimeout(() => box.remove(), kind === 'err' ? 15000 : 3500);
}
const ERR_KO = {NETWORK: '서버에 연결하지 못했어요', INVALID_SETTING: '값이 맞지 않아요', SETTINGS_READ_ONLY: '이 서버에서는 운영 설정을 바꿀 수 없어요',
  CHARACTER_ID_MISMATCH: '캐릭터가 맞지 않아요', CHARACTER_NOT_FOUND: '캐릭터를 찾지 못했어요', CONTENT_NOT_FOUND: '이 캐릭터는 아직 설정이 없어요', INVALID_REQUEST: '요청 값이 비었어요'};
async function api(method, path, body, {quiet = false} = {}) {
  const headers = {};
  if (TOKEN) headers['X-Lab-Token'] = TOKEN;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(BASE + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  } catch (e) {
    toast(ERR_KO.NETWORK, 'err', String(e));
    throw Object.assign(new Error(ERR_KO.NETWORK), {shown: true, code: 'NETWORK'});
  }
  if (res.status === 401) {  // 서버가 관리자 계정을 쓰면 LAB_LOGIN_REQUIRED (로그인이 끝났을 때도), 아니면 고정 토큰 LAB_TOKEN_REQUIRED
    ((await res.text()).includes('LAB_LOGIN_REQUIRED') ? askLogin : askToken)();
    throw Object.assign(new Error('로그인이 필요해요'), {shown: true, code: 'LOGIN'});
  }
  const text = await res.text();
  let data = text;
  try { data = text ? JSON.parse(text) : null; } catch { /* JSON이 아니면 글자 그대로 */ }
  if (!res.ok) {
    const e = data && typeof data === 'object' ? data : {};
    const code = e.code || 'HTTP_' + res.status;
    const message = ERR_KO[code] || e.message || e.error || (typeof data === 'string' ? data.slice(0, 300) : '');
    if (!quiet) toast(`${message} (${code})`, 'err', e.detail == null ? null : JSON.stringify(e.detail, null, 2));
    throw Object.assign(new Error(message), {shown: !quiet, code, detail: e.detail});
  }
  return data;
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { if (!e.shown) toast(e.message || String(e)); } finally { if (btn) btn.disabled = false; }
}
// 페이지 안 확인 창 (window.confirm 대신). 확인을 누르면 true
function modal(title, body, {ok = '확인', danger = false, cancel = '취소'} = {}) {
  const dlg = $('#modal');
  return new Promise(resolve => {
    const okBtn = h('button', {class: danger ? 'danger solid' : 'primary', type: 'submit', value: 'ok'}, ok);
    dlg.replaceChildren(h('form', {method: 'dialog', class: 'modal'}, h('h3', null, title), h('div', {class: 'body'}, body),
      h('div', {class: 'acts end'}, cancel && h('button', {type: 'button', onclick: () => dlg.close('')}, cancel), okBtn)));
    dlg.returnValue = '';
    dlg.onclose = () => resolve(dlg.returnValue === 'ok');
    dlg.showModal();
    (dlg.querySelector('input,textarea,select') || okBtn).focus();
  });
}
function askToken() { $('#tokenInput').value = TOKEN; $('#tokenbar').hidden = false; $('#tokenInput').focus(); }
function askLogin() { $('#tokenbar').hidden = true; $('#loginUser').value = ADMIN; $('#loginbar').hidden = false; (ADMIN ? $('#loginPass') : $('#loginUser')).focus(); }
function remember() {
  try { localStorage.setItem('llmLabToken', TOKEN); localStorage.setItem('llmLabAdmin', ADMIN); } catch { /* 저장소가 막힘: 이 창에서만 쓴다 */ }
}
async function login(e) {
  e.preventDefault();
  const msg = $('#loginMsg');
  msg.textContent = '';
  let res;
  try {
    res = await fetch(BASE + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: $('#loginUser').value.trim(), password: $('#loginPass').value})});
  } catch { msg.textContent = '서버에 연결하지 못했어요'; return; }
  if (!res.ok) { msg.textContent = res.status === 429 ? '시도가 너무 많아요. 1분 뒤에 다시' : res.status >= 500 ? '로그인하지 못했어요 (서버 오류)' : '아이디나 비밀번호가 틀렸어요'; return; }
  const s = await res.json();
  TOKEN = s.token; ADMIN = s.username;
  remember();
  $('#loginPass').value = '';
  $('#loginbar').hidden = true;
  // 쓰다가 로그인이 끝난 경우: 탭을 다시 만들지 않는다 (고치던 내용이 남게, 막힌 버튼만 다시 누르면 됨)
  if (META) header(); else init();
}

// cols: [{k, label, type: text|area|num|check|select|list, options, w, ph}]. 줄의 다른 값(_extra)은 그대로 돌려준다
function cellEditor(c, v, row) {
  // 긴 글은 그대로 (앞뒤 공백 · 줄바꿈을 지우면 고치지 않은 칸도 바뀐 것으로 보인다)
  if (c.type === 'area') { const el = h('textarea', {rows: c.rows || 2, value: v ?? '', placeholder: c.ph || ''}); return {el, get: () => el.value.trim() ? el.value : ''}; }
  if (c.type === 'num') { const el = h('input', {type: 'number', step: 'any', value: v ?? '', placeholder: c.ph || ''}); return {el, get: () => el.value === '' ? null : Number(el.value)}; }
  if (c.type === 'check') { const el = h('input', {type: 'checkbox', checked: !!v}); return {el: h('div', {class: 'cell-check'}, el), get: () => el.checked}; }
  if (c.type === 'select') {
    const opts = typeof c.options === 'function' ? c.options(row) : c.options;
    const known = opts.some(o => String(Array.isArray(o) ? o[0] : o) === String(v ?? ''));
    const el = sel(known || v == null ? opts : [...opts, [v, v + ' (목록에 없음)']], v == null ? '' : String(v));
    return {el, get: () => el.value};
  }
  if (c.type === 'list') { const el = h('input', {value: (v || []).join(', '), placeholder: c.ph || '쉼표로 구분'}); return {el, get: () => el.value.split(',').map(x => x.trim()).filter(Boolean)}; }
  if (c.type === 'label') return {el: h('div', {class: 'strong', style: 'padding-top:6px'}, c.text ? c.text(v) : v), get: () => v};
  const el = h('input', {value: v ?? '', placeholder: c.ph || ''});
  return {el, get: () => el.value.trim()};
}
function rowsEditor(cols, rows, {add = '+ 줄 추가', fixed = false, blank = () => ({})} = {}) {
  const tpl = `grid-template-columns:${cols.map(c => c.w || '1fr').join(' ')}${fixed ? '' : ' 32px'}`;
  const body = h('div', {class: 'rowsed'});
  const addRow = (r, focus) => {
    const cells = cols.map(c => cellEditor(c, r?.[c.k], r));
    const line = h('div', {class: 'rowline', style: tpl}, cells.map(x => x.el),
      !fixed && h('button', {type: 'button', class: 'ghost x', title: '이 줄 지우기', onclick: () => { line.remove(); body.dispatchEvent(new Event('input', {bubbles: true})); }}, '×'));
    line._get = () => ({...r, ...Object.fromEntries(cols.map((c, i) => [c.k, cells[i].get()]))});
    body.append(line);
    if (focus) line.querySelector('input,textarea')?.focus();
  };
  (rows || []).forEach(r => addRow(r));
  const el = h('div', {class: 'rowsed'}, h('div', {class: 'rowhead', style: tpl}, cols.map(c => h('span', null, c.label)), !fixed && h('span')), body,
    !fixed && h('button', {type: 'button', class: 'ghost add', onclick: () => { addRow(blank(), true); body.dispatchEvent(new Event('input', {bubbles: true})); }}, add));
  return {el, get: () => [...body.children].map(l => l._get())};
}
// 대화 점수표 (운영 설정 chatScores · 캐릭터 scores 같은 모양: 종류 → {points, lossPercent, oncePerSession, repeatPoints})
function scoresEditor(map) {
  const m = map || {};
  const rows = Object.keys(SIGNALS).concat(Object.keys(m).filter(k => !SIGNALS[k])).map(k => ({sig: k, ...(m[k] || {}), _had: k in m}));
  const ed = rowsEditor([
    {k: 'sig', label: '말 종류', type: 'label', text: k => `${SIGNALS[k] || k}`, w: '150px'},
    {k: 'points', label: '점수 (감점이면 최소 감점)', type: 'num', ph: '0', w: '1fr'},
    {k: 'lossPercent', label: '지금 값의 % 깎기', type: 'num', ph: '0', w: '1fr'},
    {k: 'oncePerSession', label: '세션에 한 번만', type: 'check', w: '100px'},
    {k: 'repeatPoints', label: '같은 세션에 또 나오면', type: 'num', ph: '같은 점수', w: '1fr'},
  ], rows, {fixed: true});
  const err = h('div', {class: 'errtxt', hidden: true}); // 틀린 칸은 표 바로 밑에
  const fail = msg => { err.textContent = msg; err.hidden = false; throw new Error(msg); };
  const isInt = n => n == null || Number.isInteger(n);
  return {el: h('div', null, ed.el, err), get() {
    err.hidden = true;
    const out = {};
    for (const r of ed.get()) {
      const name = SIGNALS[r.sig] || r.sig;
      const empty = r.points == null && !r.lossPercent && !r.oncePerSession && r.repeatPoints == null;
      if (empty && !r._had) continue;
      if (r.points == null) {
        if (empty) continue; // 원래 있던 줄을 다 비우면 뺀다 (= 0점)
        fail(`${name}: 점수를 넣어 주세요`);
      }
      if (!isInt(r.points) || !isInt(r.repeatPoints)) fail(`${name}: 점수는 정수로 넣어 주세요`);
      if (!isInt(r.lossPercent) || (r.lossPercent ?? 0) < 0 || r.lossPercent > 100) fail(`${name}: % 깎기는 0~100 정수로 넣어 주세요`);
      out[r.sig] = {points: r.points, lossPercent: r.lossPercent ?? 0, oncePerSession: !!r.oncePerSession, repeatPoints: r.repeatPoints};
    }
    return out;
  }};
}

  if (info.kind === 'int' || info.kind === 'num') return (Number(v) / (info.factor || 1)) + unit;
  if (info.kind === 'ratio') return String(v);
  if (info.kind === 'bool') return v ? '켬' : '끔';

/* ---------- 4. 공통 프롬프트 ---------- */
// ponytail: O(n·m) LCS 줄 비교. 프롬프트 크기(수백 줄)면 충분, 수천 줄이 되면 Myers diff로

  while (i < n && j < m) {

    else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', a[i++]]);
    else out.push(['+', b[j++]]);

  };

            fmtSec(x.avg), fmtSec(x.p95), fmtInt(x.over), fmtUsd(x.cost), fmtKrw(x.cost), bar(x.cost, maxP)]), [1, 2, 3, 4, 5, 6, 7]),

    m.defaultProvider === 'fake' && h('span', {class: 'chip warn'}, '가짜 AI: 형식만 확인. 실제 품질은 CAPSULE_LLM_PROVIDER=anthropic 또는 openai로'),
    h('span', {class: 'grow'}),
    h('a', {href: '/internal/llm-lab/flow', target: '_blank', rel: 'noopener', class: 'small'}, '전체 흐름 테스트 ↗'),
    ADMIN ? [h('span', {class: 'chip ok'}, ADMIN + ' 로그인'), h('button', {class: 'ghost small', onclick: logout}, '로그아웃')]
      : m.tokenRequired || TOKEN ? h('button', {class: 'ghost small', onclick: askToken}, '토큰') : null));
}
