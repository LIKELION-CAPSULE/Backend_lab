# 프론트 연동용 개발 서버(Railway dev 환경). local,shared-db 위에 얹는다: SPRING_PROFILES_ACTIVE=local,shared-db,dev-server (ADR 0018)
# DB는 공용 개발 DB(shared-db). 비밀값 없음, 값은 Railway 변수로
# 인증 메일(Brevo)과 카카오 로그인은 실제로 동작한다. 키가 빠지면 시작에 실패한다. 조용히 Fake로 떨어지지 않게 (ADR 0018 · 0020)
# local 없이 쓰지 않는다(local의 다른 설정을 물려받음). 포트는 공용 설정의 ${PORT}
server:
  forward-headers-strategy: framework # Railway 프록시 뒤에서 https · 호스트를 바르게 인식

spring:
  data:
    redis:
      url: ${REDIS_URL} # Railway Redis 서비스 변수 참조: ${{Redis.REDIS_URL}}

capsule:
  auth:
    jwt-secret: ${CAPSULE_JWT_SECRET} # local의 기본값을 쓰지 않는다. 32바이트 이상
    refresh-cookie-secure: true # https
    refresh-cookie-same-site: ${CAPSULE_REFRESH_COOKIE_SAME_SITE:None} # 프론트와 도메인이 다르면 None이어야 쿠키가 실린다 (B12)
  cors:
    allowed-origins: ${CAPSULE_CORS_ORIGINS} # 프론트 주소, 쉼표로 여러 개. 로컬 프론트도 붙이려면 http://localhost:3000 추가
  brevo:
    key: ${CAPSULE_BREVO_KEY} # 필수. Brevo > SMTP & API > API Keys
  mail:
    from: ${CAPSULE_MAIL_FROM} # 필수. Brevo에서 인증한 보내는 사람 이메일
  kakao:
    rest-api-key: ${CAPSULE_KAKAO_REST_API_KEY} # 필수. 카카오 디벨로퍼스 > 앱 키 > REST API 키
    client-secret: ${CAPSULE_KAKAO_CLIENT_SECRET:} # 콘솔에서 Client Secret을 켰을 때만
