# LLM 없이 쓰는 대사. 임시 문구 (J-04 · J-05 · J-09 · J-12 미정, 기획이 채울 표). 줄이 여러 개면 무작위로 하나
# emotion = 고정 대사의 감정 (옛 FakeLlmClient의 trigger별 감정 자리). 19 모션·표정은 이 감정으로 고른다
# reactions: 상태 반응(19). 키 = trigger. AWAY_2 · AWAY_3 = intensity 2 · 3 (대사가 없으면 AWAY 대사)
#   lines   = 기본 (모든 호감도 단계)
#   byLevel = 호감도 단계 N 이상에서 쓰는 대사. 현재 단계 이하 중 가장 높은 칸, 없으면 lines
reactions:
  GREETING:
    situation: "사용자가 공부를 막 시작했다"
    emotion: HAPPY
    lines: ["왔구나. 오늘도 같이 해볼까?", "안녕. 오늘도 잘 부탁해."]
    byLevel:
      2: ["왔다! 오늘은 뭐부터 할까?", "기다리고 있었어. 시작하자."]
      3: ["늦었잖아~ 얼른 앉아, 같이 하자.", "오늘도 왔네. 역시 내 짝꿍."]
  AWAY:
    situation: "사용자가 방금 자리에서 일어나 나갔다 (아직 안 돌아옴)"
    emotion: SAD
    lines: ["잠깐 자리 비운 거야?", "어… 어디 갔어?"]
    byLevel:
      2: ["어디 가? 금방 와야 해.", "잠깐 쉬는 거지?"]
      3: ["또 도망가는 거야~?", "빨리 와. 혼자 있으면 심심하단 말이야."]
  AWAY_2:
    situation: "사용자가 1분째 돌아오지 않았다"
    emotion: SAD
    lines: ["아직이야? 기다리고 있을게.", "언제 와?"]
    byLevel:
      3: ["1분이나 지났어. 나 삐질 거야?", "어디서 뭐 해~ 빨리 와."]
  AWAY_3:
    situation: "사용자가 5분째 돌아오지 않았다"
    emotion: SAD
    lines: ["많이 바쁜가 보네. 오면 이어서 하자.", "…계속 기다리는 중."]
    byLevel:
      3: ["진짜 서운해지려고 해…", "나 혼자 두고 어디 간 거야."]
  RETURN:
    situation: "자리를 비웠던 사용자가 돌아왔다"
    emotion: HAPPY
    lines: ["왔네. 이어서 하자.", "돌아왔구나. 다시 해볼까?"]
    byLevel:
      2: ["왔다! 이제 다시 집중!", "기다렸어. 이어서 하자."]
      3: ["드디어 왔다~ 보고 싶었잖아.", "늦었어. 대신 지금부터 열심히 해."]
  BREAK:
    situation: "사용자가 쉬는 시간을 시작했다"
    emotion: NEUTRAL
    lines: ["잠깐 쉬자.", "수고했어. 조금 쉬어."]
    byLevel:
      3: ["쉬는 시간이다~ 물 한 잔 마시고 와.", "고생했어. 잠깐 숨 돌리자."]
  BREAK_END:
    situation: "쉬는 시간을 끝내고 다시 공부를 시작했다"
    emotion: NEUTRAL
    lines: ["다시 시작해볼까?", "좋아, 이어서 하자."]
    byLevel:
      3: ["충전 완료? 다시 달려보자.", "자, 다시 집중 모드!"]
  DROWSY:
    situation: "졸려 보인다"
    emotion: NEUTRAL
    lines: ["졸려? 기지개 한 번 켜고 하자.", "눈이 감기는 것 같은데… 괜찮아?"]
    byLevel:
      3: ["졸면 안 돼~ 나랑 조금만 더 하자.", "꾸벅꾸벅하는 거 다 보여."]
  YAWN:
    situation: "하품을 했다"
    emotion: NEUTRAL
    lines: ["하품했지? 물 한 모금 마시고 와.", "피곤하구나. 스트레칭 한 번 하자."]
    byLevel:
      3: ["하품 옮았잖아… 기지개 같이 켜자.", "크게 하품했다~ 조금만 쉬었다 할래?"]
  WAVE:
    situation: "나에게 손을 흔들었다"
    emotion: HAPPY
    lines: ["나도 안녕! 계속 해 보자.", "응, 나 여기 있어."]
    byLevel:
      3: ["뭐야~ 갑자기 손 흔들고. 나도 반가워!", "나 부른 거야? 여기 있지."]
  HEAD_TURN: # 명세 #44, session #45
    situation: "공부하다 고개를 돌려 딴 데를 봤다"
    emotion: NEUTRAL
    lines: ["어디 봐? 여기 집중!", "뭐 있어? 다시 여기 보자."]
    byLevel:
      3: ["딴 데 보지 말고 나 봐~", "한눈팔면 안 돼. 집중!"]
fallbacks: # LLM이 마감(llm-budget) 안에 못 만들 때
  reply: ["미안, 잠깐 딴생각했어. 다시 말해줄래?"]
  closing: ["오늘도 같이 공부해서 좋았어. 다음에도 함께하자."]
